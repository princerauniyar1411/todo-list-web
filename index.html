<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --danger: #ef4444;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 20px 40px;
      }

      .site-header {
        position: relative;
        width: 100%;
        max-width: 860px;
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding: 12px 20px 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 18px;
        background: linear-gradient(115deg, #7c3aed, #ec4899 58%, #fb923c);
        box-shadow: 0 12px 26px rgba(124, 58, 237, 0.2);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: white;
        font-size: 1.15rem;
        font-weight: 700;
        text-decoration: none;
        text-shadow: 0 1px 2px rgba(52, 18, 83, 0.2);
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .site-nav a {
        padding: 9px 13px;
        border-radius: 9px;
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        transform: translateY(-1px);
      }

      .animal-track {
        position: absolute;
        right: 18px;
        bottom: 3px;
        left: 18px;
        height: 22px;
        overflow: hidden;
        pointer-events: none;
      }

      .walker {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 17px;
        line-height: 1;
        animation: walk-across 12s linear infinite;
      }

      .walker span {
        display: block;
        animation: tiny-step 0.35s ease-in-out infinite alternate;
      }

      .walker-rabbit {
        animation-delay: -6s;
        animation-duration: 15s;
      }

      .walker-rabbit span {
        animation-delay: -0.15s;
      }

      @keyframes walk-across {
        from {
          left: 0;
          transform: translateX(0);
        }
        to {
          left: 100%;
          transform: translateX(-100%);
        }
      }

      @keyframes tiny-step {
        from {
          transform: translateY(0) rotate(-5deg);
        }
        to {
          transform: translateY(-3px) rotate(5deg);
        }
      }

      .todo-app {
        width: 100%;
        max-width: 540px;
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 18px 35px rgba(37, 99, 235, 0.12);
        padding: 28px;
      }

      h1 {
        margin: 0 0 20px;
        text-align: center;
        font-size: 2rem;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      button {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .add-btn {
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        font-weight: bold;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
        animation: pulse 2s infinite ease-in-out;
      }

      .add-btn:hover {
        background: var(--primary-dark);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }

      .todo-item {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        animation: fadeInUp 0.35s ease forwards;
      }

      .todo-item.removing {
        animation: fadeOut 0.25s ease forwards;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateX(18px) scale(0.96);
          height: 0;
          margin: 0;
          padding-top: 0;
          padding-bottom: 0;
          border-bottom-width: 0;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
      }

      .task-text {
        flex: 1;
        word-break: break-word;
      }

      .completed .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .delete-btn {
        background: #fee2e2;
        color: var(--danger);
        padding: 8px 10px;
        font-weight: bold;
      }

      .empty-state {
        padding: 20px 10px;
        text-align: center;
        color: var(--muted);
        animation: fadeInUp 0.3s ease;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 14px 28px;
        }

        .site-header {
          margin-bottom: 18px;
          padding-right: 12px;
          padding-left: 12px;
        }

        .site-nav {
          gap: 0;
        }

        .site-nav a {
          padding: 8px;
          font-size: 0.88rem;
        }

        .todo-app {
          padding: 22px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header" id="top">
      <a class="brand" href="#top" aria-label="Todo List home">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>Todo List</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#todoList">My tasks</a>
        <a href="#taskInput">Add task</a>
      </nav>
      <div class="animal-track" aria-hidden="true">
        <span class="walker"><span>🐈</span></span>
        <span class="walker walker-rabbit"><span>🐇</span></span>
      </div>
    </header>

    <div class="todo-app">
      <h1>Todo List</h1>

      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Add a new task..." />
        <button class="add-btn" id="addTaskBtn">Add</button>
      </div>

      <ul id="todoList"></ul>
    </div>

    <script>
      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const todoList = document.getElementById('todoList');

      const STORAGE_KEY = 'todo-list-items';

      let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function renderTodos() {
        todoList.innerHTML = '';

        if (todos.length === 0) {
          const emptyMessage = document.createElement('li');
          emptyMessage.className = 'empty-state';
          emptyMessage.textContent = 'No tasks yet. Add one above!';
          todoList.appendChild(emptyMessage);
          return;
        }

        todos.forEach((todo) => {
          const li = document.createElement('li');
          li.classList.add('todo-item');

          if (todo.completed) {
            li.classList.add('completed');
          }

          const taskMain = document.createElement('div');
          taskMain.className = 'task-main';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.setAttribute('aria-label', `Mark ${todo.text} as complete`);
          checkbox.addEventListener('change', () => {
            todo.completed = checkbox.checked;
            saveTodos();
            renderTodos();
          });

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = todo.text;

          taskMain.appendChild(checkbox);
          taskMain.appendChild(text);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', () => {
            li.classList.add('removing');
            setTimeout(() => {
              todos = todos.filter((item) => item.id !== todo.id);
              saveTodos();
              renderTodos();
            }, 220);
          });

          li.appendChild(taskMain);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      function addTodo() {
        const text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }

        todos.unshift({
          id: Date.now(),
          text,
          completed: false
        });

        saveTodos();
        renderTodos();
        taskInput.value = '';
        taskInput.focus();
      }

      addTaskBtn.addEventListener('click', addTodo);

      taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          addTodo();
        }
      });

      renderTodos();
    </script>
  </body>
</html>
